<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Mapa y catálogo de El Verbenal, Usaquén, Bogotá.">
  <title>Atlas Verbenal · Bogotá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/panels.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="top">
    <a href="/" class="brand"><span aria-hidden="true">⌖</span> Atlas Verbenal</a>
    <nav aria-label="Navegación"><a href="#explorar">Explorar</a><button id="editor">Modo edición</button></nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="hero-inner">
        <div><p class="eyebrow">Bogotá D.C. / Usaquén</p>
          <h1 id="title">El Verbenal<span>.</span></h1>
          <p class="intro">Explora el barrio, sus servicios y su entorno en un mapa con fichas y fuentes consultables.</p>
        </div>
        <a href="#explorar" class="hero-link">Ir al mapa <span aria-hidden="true">↘</span></a>
      </div>
    </section>
    <section class="explore" id="explorar" aria-labelledby="explore-title">
      <div class="section-head"><div><p class="eyebrow">MAPA Y CATÁLOGO</p>
        <h2 id="explore-title">Explora el barrio</h2></div>
        <label class="search"><span>Buscar en la capa</span><input id="search" type="search" placeholder="Nombre, dirección o dato"></label>
      </div>
      <div class="layout">
        <aside class="sidebar" aria-label="Capas del atlas">
          <h3>Capas del atlas</h3><div id="categories"></div>
        </aside>
        <div class="content">
          <div id="map" aria-label="Mapa interactivo de El Verbenal"></div>
          <div class="layer-header"><div><h3 id="layer"></h3><p id="hint"></p></div><button id="new" hidden>Nueva ficha</button></div>
          <p id="status" role="status" aria-live="polite"></p><div id="records"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>Atlas Verbenal <span>Usaquén · Bogotá, Colombia</span></footer>
  <dialog id="dialog">
    <form id="form">
      <header><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="Cerrar">×</button></header>
      <div id="fields"></div><p id="form-error" role="alert"></p><button class="primary" type="submit">Guardar</button>
    </form>
  </dialog>
  <template id="edit-fields">
    <label>Nombre <input name="title" required maxlength="140"></label>
    <label>Descripción <textarea name="detail" required maxlength="1800" rows="3"></textarea></label>
    <label>Datos de la ficha <textarea name="facts" maxlength="600" rows="2"></textarea></label>
    <label>Alcance <select name="scope"><option>Barrio</option><option>Entorno</option><option>Localidad</option><option>Distrital</option></select></label>
    <label>Vigencia o fecha <input name="period" maxlength="100"></label>
    <label>Enlace de la fuente <input name="source" type="url" required maxlength="700"></label>
    <label>Geometría GeoJSON (opcional) <textarea name="geometry" rows="3" placeholder='{"type":"Point","coordinates":[-74.03,4.76]}'></textarea></label>
  </template>
</body>
</html>
